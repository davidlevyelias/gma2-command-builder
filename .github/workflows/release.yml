name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run builds the bundle without checking the tag or publishing.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${{ github.ref_name }}" = "v$(node -p "require('./package.json').version")"

      - name: Bundle
        run: npm run bundle

      - name: Name the bundle after the tag
        run: cp dist/gma2-command-builder.lua "dist/gma2-command-builder-${{ github.ref_name }}.lua"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/gma2-command-builder-${{ github.ref_name }}.lua" \
            --title "${{ github.ref_name }}" \
            --generate-notes
